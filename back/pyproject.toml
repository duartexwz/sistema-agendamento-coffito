[project]
name = "Agendamento-Coffito"
version = "0.1.0"
description = ""
authors = [
    {name = "duartexwz",email = "mayckonkennedy877@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, < 4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "fastapi-mail (>=1.4.0,<2.0.0)",
    "slowapi (>=0.1.10,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "time-machine (>=3.4.0,<4.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)"
]


[tool.ruff]
line-length = 85

[tool.ruff.lint]
preview = false
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = false
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = '.'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'session'
asyncio_default_test_loop_scope = 'session'
env_files = ['.env.test']
env_override_existing_values = 1
timeout = 20

[tool.coverage.run]
source = ['app', 'tests']
concurrency = ['thread', 'greenlet']


[tool.taskipy.tasks]
lint = 'ruff check'
format = 'ruff format'
run = 'fastapi dev api/app.py'
test = 'ruff format && pytest -s -x --cov=api -vv'
pre_format = 'ruff check --fix'
pre_test = 'task lint'
post_test = 'coverage html'

[tool.poetry]
packages = [{ include = "api" }]
